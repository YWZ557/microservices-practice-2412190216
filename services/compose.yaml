name: zjgsu-library-monolith

x-app-env: &app-env
  TZ: Asia/Shanghai
  SKY_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
  SKY_DATASOURCE_HOST: mysql
  SKY_DATASOURCE_PORT: "3306"
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_DISCOVERY_GROUP: PERSONAL_GROUP
  SPRING_CLOUD_NACOS_USERNAME: nacos
  SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD:-123456}

services:

  # ---------------- MySQL：三个独立库（user / book / borrow） ----------------
  mysql:
    image: mysql:8.0
    container_name: library-monolith-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/01-library-user.sql:/docker-entrypoint-initdb.d/01-library-user.sql:ro
      - ./db/02-library-book.sql:/docker-entrypoint-initdb.d/02-library-book.sql:ro
      - ./db/03-library-borrow.sql:/docker-entrypoint-initdb.d/03-library-borrow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - library-net

  # ---------------- Nacos 注册中心 ----------------
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: library-monolith-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请先在 services/.env 中设置 NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请先在 services/.env 中设置 NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请先在 services/.env 中设置 NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: "18000"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "${NACOS_CONSOLE_PORT:-18080}:8080"
      - "${NACOS_SERVER_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_SERVER_PORT:-9849}:9849"
    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
    networks:
      - library-net

  # ---------------- 读者服务 8081 ----------------
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.monolith
      args:
        MODULE: library-user
    image: library/library-user:week08
    container_name: library-monolith-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      SPRING_APPLICATION_NAME: library-user
      SKY_DATASOURCE_DATABASE: library_user
      SKY_DATASOURCE_USERNAME: user_svc
      SKY_DATASOURCE_PASSWORD: user_pass
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - library-net

  # ---------------- 图书服务 8082：两个副本，由 Feign LoadBalancer 轮询 ----------------
  book-service:
    build:
      context: .
      dockerfile: Dockerfile.monolith
      args:
        MODULE: library-book
    image: library/library-book:week08
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    environment:
      <<: *app-env
      SERVER_PORT: "8082"
      SPRING_APPLICATION_NAME: library-book
      SKY_DATASOURCE_DATABASE: library_book
      SKY_DATASOURCE_USERNAME: book_svc
      SKY_DATASOURCE_PASSWORD: book_pass
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 2
    networks:
      - library-net

  # ---------------- 借阅服务 8083：Feign 调用 user/book ----------------
  borrow-service:
    build:
      context: .
      dockerfile: Dockerfile.monolith
      args:
        MODULE: library-borrow
    image: library/library-borrow:week08
    container_name: library-monolith-borrow
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      user-service:
        condition: service_healthy
      book-service:
        condition: service_started
    environment:
      <<: *app-env
      SERVER_PORT: "8083"
      SPRING_APPLICATION_NAME: library-borrow
      SKY_DATASOURCE_DATABASE: library_borrow
      SKY_DATASOURCE_USERNAME: borrow_svc
      SKY_DATASOURCE_PASSWORD: borrow_pass
    ports:
      - "${BORROW_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - library-net

  # ---------------- 网关 8080 ----------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.monolith
      args:
        MODULE: library-gateway
    image: library/library-gateway:week08
    container_name: library-monolith-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
      user-service:
        condition: service_healthy
      book-service:
        condition: service_started
      borrow-service:
        condition: service_healthy
    environment:
      <<: *app-env
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: library-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - library-net

volumes:
  mysql-data:
    name: library-monolith-mysql-data

networks:
  library-net:
    name: library-monolith-net
