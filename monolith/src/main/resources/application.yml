spring:
  application:
    name: monolith
  datasource:
    url: jdbc:mysql://localhost:3306/library
    username: "root"
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      continue-on-error: false
mybatis:
  mapper-locations: classpath*:com/zjgsu/zyw/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
# 服务端口默认8080
server:
  port: 8080

# actuator暴露健康端点
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always