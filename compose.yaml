# ============================================================
# 图书馆借阅系统 · 第 06 周微服务编排
# ------------------------------------------------------------
# 一键启动：docker compose up -d --build
# 查看状态：docker compose ps
# 查看日志：docker compose logs -f borrow-service
# 停止（保留数据）：docker compose down
# 停止并删除数据卷：docker compose down -v
# ------------------------------------------------------------
# 拓扑：
#   mysql（一个实例，三个独立数据库/账号）
#     ├── library_user    -> user-service
#     ├── library_book    -> book-service
#     └── library_borrow  -> borrow-service
#
# 容器间通过 Compose 服务名通信：
#   mysql:3306、user-service:8081、book-service:8082
# 不使用 localhost 访问其他容器。
# ============================================================

name: library

services:

  # ---------------- MySQL 数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_ROOT_HOST: "%"
    ports:
      # 宿主机 3306 被本地 MySQL 占用时，默认映射到 3307
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      # 命名卷：容器删除/重建后数据仍然保留
      - mysql-data:/var/lib/mysql
      # 首次初始化：创建三个独立数据库、三个账号及各自的表
      - ./services/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - library-net

  # ---------------- 用户/读者服务 ----------------
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    image: library/user-service:week06
    container_name: library-user-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/library_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: user_svc
      SPRING_DATASOURCE_PASSWORD: user_pass
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - library-net

  # ---------------- 图书服务 ----------------
  book-service:
    build:
      context: ./services/book-service
      dockerfile: Dockerfile
    image: library/book-service:week06
    container_name: library-book-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/library_book?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: book_svc
      SPRING_DATASOURCE_PASSWORD: book_pass
    ports:
      - "${BOOK_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - library-net

  # ---------------- 借阅服务 ----------------
  borrow-service:
    build:
      context: ./services/borrow-service
      dockerfile: Dockerfile
    image: library/borrow-service:week06
    container_name: library-borrow-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_healthy
      book-service:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/library_borrow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: borrow_svc
      SPRING_DATASOURCE_PASSWORD: borrow_pass
      READER_SERVICE_URL: http://user-service:8081
      BOOK_SERVICE_URL: http://book-service:8082
    ports:
      - "${BORROW_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - library-net

volumes:
  mysql-data:
    name: library-mysql-data

networks:
  library-net:
    name: library-net
