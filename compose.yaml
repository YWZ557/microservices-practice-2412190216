# ============================================================
# 根目录统一入口
# ------------------------------------------------------------
# 实际服务定义在 services/compose.yaml：
#   MySQL（library_user / library_book / library_borrow 三库）+ Nacos
#   + library-user / library-book(2 副本) + library-borrow + library-gateway
# 根目录不再引用旧的 services/user-service|book-service|borrow-service。
# ------------------------------------------------------------
# 一键启动：docker compose up -d --build
# 查看状态：docker compose ps
# 查看日志：docker compose logs -f borrow-service
# 停止（保留数据）：docker compose down
# 停止并删除数据卷：docker compose down -v
# ============================================================

name: zjgsu-library-monolith

include:
  - path: services/compose.yaml
